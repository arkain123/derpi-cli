[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "derpi-cli"
version = "2.0.1"
description = "CLI for Derpibooru API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.scripts]
derpi = "derpi.cli:main"

[tool.setuptools]
packages = ["derpi"]

[tool.setuptools.package-data]
derpi = ["../derpi.1"]
